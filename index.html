<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="交互式 CSS Flexbox 演示站：把剩余空间与 grow/shrink 的尺寸分配过程可视化" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080b12" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://huberyyang-space.github.io/todo-flex/" />
    <meta property="og:title" content="todo-flex · 看得见的 CSS Flexbox" />
    <meta
      property="og:description"
      content="交互式 CSS Flexbox 演示站：把剩余空间与 grow/shrink 的尺寸分配过程可视化"
    />
    <meta name="twitter:card" content="summary" />
    <title>todo-flex · 看得见的 CSS Flexbox</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div>本站需要启用 JavaScript 才能运行。</div>
    </noscript>
    <script>
      // 键名必须与 useDark() 写入的一致（@vueuse/core 的 useColorMode 默认键），
      // 对不上就永远读到 null，用户显式选过的主题会在刷新时先闪一帧系统主题
      ;(function () {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        let setting = 'auto'
        try {
          setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
        } catch {}
        if (setting === 'dark' || (prefersDark && setting !== 'light'))
          document.documentElement.classList.toggle('dark', true)
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
